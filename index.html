function shuffleArray(array){

const arr=[...array];

for(let i=arr.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[arr[i],arr[j]]=
[arr[j],arr[i]];

}

return arr;

}

let currentTest = null;

let questions = [];

let currentIndex = 0;

let score = 0;

let wrongQuestions = [];

document
.getElementById('login-btn')
.onclick = async()=>{

const username =
document
.getElementById('username')
.value;

const password =
document
.getElementById('password')
.value;

const {data,error} =
await supabaseClient
.from('users')
.select('*')
.eq('username',username)
.eq('password',password)
.single();

if(error || !data){

alert(
'Неверный логин или пароль'
);

return;

}

currentUser = data;
  localStorage.setItem(
'user',
JSON.stringify(data)
);

if(currentUser.role==='admin'){

const openAdmin =
confirm(
'Открыть админ-панель?'
);

if(openAdmin){

openAdminPanel();

return;

}

}

showTestSelection();

};

function startTest(testKey){

currentTest = testKey;

questions =
shuffleArray(
tests[testKey]
);

currentIndex = 0;

score = 0;

wrongQuestions = [];

document
.getElementById('login-card')
.classList.add('hidden');

document
.getElementById('quiz-card')
.classList.remove('hidden');

document.querySelector(
'#quiz-card h1'
).innerText =
getTestTitle(testKey);

loadQuestion();

}

function getTestTitle(key){

const titles = {

personal_finance:
'Персональные финансы',

portfolio_theory:
'Теория портфеля',

econometrics:
'Эконометрика',

bank_accounting:
'Бухгалтерия в банке',

'Бухгалтерский учет в банке',

green_economy:
'Зеленая экономика',

money_and_banks:
'Деньги и банки',

finance:
'Финансы'

};

return titles[key] || 'Тест';

}

</button>

function loadQuestion(){
const q =
questions[currentIndex];

document
.getElementById('counter')
.innerText =
`Вопрос ${currentIndex+1}
из ${questions.length}`;

document
.getElementById('question')
.innerText = q.q;

document
.getElementById('progress-bar')
.style.width =
`${(currentIndex/questions.length)*100}%`;

const options =
document
.getElementById('options');

options.innerHTML='';

q.a.forEach(
(option,index)=>{

const btn =
document.createElement('button');

btn.className='option';

btn.innerText=option;

btn.onclick=()=>
selectAnswer(
btn,
index===q.c
);

options.appendChild(btn);

});

}

function selectAnswer(
btn,
isCorrect
){

const buttons =
document
.querySelectorAll('.option');

buttons.forEach(
b=>b.disabled=true
);

if(isCorrect){

btn.classList.add('correct');

score++;

}else{

btn.classList.add('wrong');

wrongQuestions.push(
questions[currentIndex]
);

buttons.forEach((b,i)=>{

if(
i===questions[currentIndex].c
){
b.classList.add('correct');
}

});

}

document
.getElementById('next-btn')
.classList.remove('hidden');

}

document
.getElementById('next-btn')
.onclick = ()=>{

currentIndex++;

if(
currentIndex<questions.length
){

loadQuestion();

document
.getElementById('next-btn')
.classList.add('hidden');

}else{

finishQuiz();

}

};

async function saveResult(){

const total =
questions.length;

const percentage =
((score/total)*100)
.toFixed(2);

await supabaseClient
.from('results')
.insert([
{
username:
currentUser.username,

test_name:getTestTitle(currentTest),

score:score,

total:total,

percentage:percentage
}
]);

}

async function finishQuiz(){

await saveResult();

document
.getElementById('quiz-card')
.classList.add('hidden');

document
.getElementById('result-card')
.classList.remove('hidden');

document
.getElementById('score')
.innerText =
`${score} / ${questions.length}`;

}

document
.getElementById('restart-btn')
.onclick = ()=>{

location.reload();

};

document
.getElementById('wrong-btn')
.onclick = ()=>{

if(!wrongQuestions.length){

alert('Ошибок нет');

return;

}

questions =
shuffleArray(
wrongQuestions
);

currentIndex = 0;

score = 0;

wrongQuestions = [];

document
.getElementById('result-card')
.classList.add('hidden');

document
.getElementById('quiz-card')
.classList.remove('hidden');

loadQuestion();

};
const savedUser =
localStorage.getItem('user');

if(savedUser){

currentUser =
JSON.parse(savedUser);

if(currentUser.role==='admin'){

openAdminPanel();

}else{

showTestSelection();

}

}
