<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEMIS Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #24303f;
      --muted: #6b7280;
      --primary: #1368CE;
      --border: #d7dce3;
      --ok: #28a745;
      --bad: #dc3545;
      --shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px;
      margin-top: 20px;
      box-shadow: var(--shadow);
    }

    .hidden { display: none !important; }

    h1, h2 {
      margin: 0 0 16px 0;
      color: var(--primary);
      text-align: center;
    }

    .muted {
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 16px;
      outline: none;
    }

    input, select {
      background: #fff;
      color: var(--text);
    }

    button {
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: transform .05s ease, opacity .2s ease, background .2s ease;
      font-weight: 700;
    }

    button:hover { opacity: .95; }
    button:active { transform: translateY(1px); }

    .btn-ok { background: var(--ok); }
    .btn-bad { background: var(--bad); }
    .btn-gray { background: #e9eef5; color: var(--text); }
    .btn-dark { background: #24303f; }

    .screen-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .screen-top .left {
      flex: 1;
      min-width: 0;
    }

    .screen-top .right {
      width: 160px;
      flex: 0 0 160px;
    }

    .screen-top .title-left {
      text-align: left;
      margin: 0;
    }

    .screen-top .subtitle-left {
      text-align: left;
      margin: 4px 0 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin: 18px 0 20px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width .25s ease;
    }

    #counter {
      color: var(--muted);
      margin-bottom: 8px;
      text-align: left;
      font-size: 14px;
    }

    #question {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 18px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .option {
      background: #eef2f7;
      color: var(--text);
      margin-top: 10px;
      text-align: left;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background .2s ease, transform .05s ease, border-color .2s ease;
      width: 100%;
    }

    .option:hover {
      background: #dbe7ff;
      border-color: #c8d5ef;
    }

    .option:disabled {
      cursor: default;
      opacity: .96;
    }

    .correct {
      background: rgba(40,167,69,.12) !important;
      color: #145c26 !important;
      border-color: rgba(40,167,69,.35) !important;
      font-weight: 700;
    }

    .wrong {
      background: rgba(220,53,69,.12) !important;
      color: #8c1e2b !important;
      border-color: rgba(220,53,69,.35) !important;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .small-note {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .result-score {
      text-align: center;
      font-size: 44px;
      font-weight: 800;
      color: var(--primary);
      margin: 10px 0 6px 0;
    }

    .result-meta {
      text-align: center;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .toolbar button {
      width: auto;
      flex: 1 1 180px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
    }

    th, td {
      border: 1px solid #dfe5ee;
      padding: 12px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: var(--primary);
      color: #fff;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .admin-section {
      margin-top: 18px;
    }

    .admin-head {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .admin-head button {
      width: auto;
      flex: 1 1 220px;
    }

    @media (max-width: 720px) {
      .container { padding: 14px; }
      .card { padding: 18px; border-radius: 16px; }
      .grid { grid-template-columns: 1fr; }
      .screen-top {
        flex-direction: column;
        align-items: stretch;
      }
      .screen-top .right {
        width: 100%;
        flex: 1 1 auto;
      }
      #question { font-size: 21px; }
      .result-score { font-size: 36px; }
      .toolbar button {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function cloneQuestion(q) {
      return {
        q: q.q,
        a: Array.isArray(q.a) ? [...q.a] : [],
        c: q.c
      };
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('Введите логин и пароль');
        return;
      }

      const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .single();

      if (error || !data) {
        alert('Неверный логин или пароль');
        return;
      }

      state.currentUser = data;
      setSavedUser(data);

      if (data.role === 'admin') {
        await openAdminPanel();
      } else {
        renderSelection();
      }
    }

    function startTest(testKey) {
      if (!tests[testKey]) {
        alert('Тест не найден');
        return;
      }

      state.currentTestKey = testKey;
      state.questions = shuffleArray(tests[testKey].map(cloneQuestion));
      state.currentIndex = 0;
      state.score = 0;
      state.wrongQuestions = [];

      renderQuizShell();
      loadQuestion();
    }

    function loadQuestion() {
      if (!state.questions.length) {
        finishQuiz();
        return;
      }

      const q = state.questions[state.currentIndex];
      const total = state.questions.length;

      document.getElementById('quiz-title').innerText = getTestTitle(state.currentTestKey);
      document.getElementById('counter').innerText = `Вопрос ${state.currentIndex + 1} из ${total}`;
      document.getElementById('progress-bar').style.width = `${(state.currentIndex / total) * 100}%`;
      document.getElementById('question').innerText = q.q;

      const options = document.getElementById('options');
      options.innerHTML = '';

      const shuffledOptions = shuffleArray(
        q.a.map((text, idx) => ({
          text,
          correct: idx === q.c
        }))
      );

      shuffledOptions.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.type = 'button';
        btn.textContent = item.text;
        btn.dataset.correct = item.correct ? '1' : '0';
        btn.addEventListener('click', () => selectAnswer(btn, item.correct));
        options.appendChild(btn);
      });

      document.getElementById('next-btn').classList.add('hidden');
    }

    function selectAnswer(selectedBtn, isCorrect) {
      const buttons = document.querySelectorAll('#options .option');
      buttons.forEach(btn => btn.disabled = true);

      buttons.forEach(btn => {
        if (btn.dataset.correct === '1') {
          btn.classList.add('correct');
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.add('wrong');
        state.wrongQuestions.push(cloneQuestion(state.questions[state.currentIndex]));
      } else {
        state.score++;
      }

      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      state.currentIndex++;

      if (state.currentIndex < state.questions.length) {
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    async function saveResult() {
      const total = state.questions.length || 1;
      const percentage = Number(((state.score / total) * 100).toFixed(2));

      const { error } = await supabaseClient
        .from('results')
        .insert([
          {
            username: state.currentUser.username,
            test_name: getTestTitle(state.currentTestKey),
            score: state.score,
            total: state.questions.length,
            percentage: percentage
          }
        ]);

      if (error) {
        console.error('Ошибка сохранения результата:', error);
      }
    }

    async function finishQuiz() {
      await saveResult();
      renderResult();
    }

    function repeatWrong() {
      if (!state.wrongQuestions.length) {
        alert('Ошибок нет');
        return;
      }

      state.questions = shuffleArray(state.wrongQuestions.map(cloneQuestion));
      state.currentIndex = 0;
      state.score = 0;
      state.wrongQuestions = [];

      renderQuizShell();
      loadQuestion();
    }

    function backToSelection() {
      state.currentTestKey = null;
      state.questions = [];
      state.currentIndex = 0;
      state.score = 0;
      state.wrongQuestions = [];
      renderSelection();
    }

    function logout() {
      clearSavedUser();
      state.currentUser = null;
      state.currentTestKey = null;
      state.questions = [];
      state.currentIndex = 0;
      state.score = 0;
      state.wrongQuestions = [];
      renderLogin();
    }

    async function createUser() {
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value.trim();
      const role = document.getElementById('new-role').value;

      if (!username || !password) {
        alert('Заполните поля');
        return;
      }

      const { error } = await supabaseClient
        .from('users')
        .insert([
          { username, password, role }
        ]);

      if (error) {
        alert('Ошибка создания пользователя');
        console.error(error);
        return;
      }

      await openAdminPanel();
      alert('Пользователь создан');
    }

    async function deleteUser(id) {
      const ok = confirm('Удалить пользователя?');
      if (!ok) return;

      const { error } = await supabaseClient
        .from('users')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Ошибка удаления пользователя');
        console.error(error);
        return;
      }

      await openAdminPanel();
    }

    async function deleteResult(id) {
      const ok = confirm('Удалить результат?');
      if (!ok) return;

      const { error } = await supabaseClient
        .from('results')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Ошибка удаления результата');
        console.error(error);
        return;
      }

      await openAdminPanel();
    }

    async function openAdminPanel() {
      showScreen('screen-admin');

      const [usersResponse, resultsResponse] = await Promise.all([
        supabaseClient.from('users').select('*').order('id', { ascending: true }),
        supabaseClient.from('results').select('*').order('id', { ascending: false })
      ]);

      const users = usersResponse.data || [];
      const results = resultsResponse.data || [];

      renderAdminPanel(users, results);
    }

    function init() {
      const savedUser = localStorage.getItem('user');

      if (savedUser) {
        try {
          const parsed = JSON.parse(savedUser);
          state.currentUser = parsed;

          if (parsed.role === 'admin') {
            openAdminPanel();
          } else {
            renderSelection();
          }
          return;
        } catch (e) {
          localStorage.removeItem('user');
        }
      }

      renderLogin();
    }

    init();
  </script>
