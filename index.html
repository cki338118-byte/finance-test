<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEMIS Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #24303f;
      --muted: #6b7280;
      --primary: #1368CE;
      --border: #d7dce3;
      --ok: #28a745;
      --bad: #dc3545;
      --shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px;
      margin-top: 20px;
      box-shadow: var(--shadow);
    }

    .hidden { display: none !important; }

    h1, h2 {
      margin: 0 0 16px 0;
      color: var(--primary);
      text-align: center;
    }

    .muted {
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 16px;
      outline: none;
    }

    input, select {
      background: #fff;
      color: var(--text);
    }

    button {
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: transform .05s ease, opacity .2s ease, background .2s ease;
      font-weight: 700;
    }

    button:hover { opacity: .95; }
    button:active { transform: translateY(1px); }

    .btn-ok { background: var(--ok); }
    .btn-bad { background: var(--bad); }
    .btn-gray { background: #e9eef5; color: var(--text); }

    .screen-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .screen-top .left { flex: 1; min-width: 0; }
    .screen-top .right { width: 160px; flex: 0 0 160px; }
    .screen-top .title-left { text-align: left; margin: 0; }
    .screen-top .subtitle-left { text-align: left; margin: 4px 0 0 0; color: var(--muted); font-size: 14px; }

    .progress {
      width: 100%;
      height: 12px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin: 18px 0 20px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width .25s ease;
    }

    #counter { color: var(--muted); margin-bottom: 8px; text-align: left; font-size: 14px; }
    #question { font-size: 24px; font-weight: 700; margin-bottom: 18px; line-height: 1.35; white-space: pre-wrap; }

    .option {
      background: #eef2f7;
      color: var(--text);
      margin-top: 10px;
      text-align: left;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background .2s ease, transform .05s ease, border-color .2s ease;
      width: 100%;
    }

    .option:hover { background: #dbe7ff; border-color: #c8d5ef; }
    .option:disabled { cursor: default; opacity: .96; }

    .correct {
      background: rgba(40,167,69,.12) !important;
      color: #145c26 !important;
      border-color: rgba(40,167,69,.35) !important;
      font-weight: 700;
    }
    .wrong {
      background: rgba(220,53,69,.12) !important;
      color: #8c1e2b !important;
      border-color: rgba(220,53,69,.35) !important;
      font-weight: 700;
    }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .small-note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }
    .result-score { text-align: center; font-size: 44px; font-weight: 800; color: var(--primary); margin: 10px 0 6px 0; }
    .result-meta { text-align: center; color: var(--muted); margin-top: 6px; margin-bottom: 12px; }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; justify-content: center; }
    .toolbar button { width: auto; flex: 1 1 180px; max-width: 300px; }

    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { border: 1px solid #dfe5ee; padding: 12px; text-align: center; vertical-align: middle; }
    th { background: var(--primary); color: #fff; }
    .table-wrap { overflow-x: auto; }

    .admin-section { margin-top: 18px; }

    /* Tabs CSS */
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e9eef5;
      padding-bottom: 10px;
      overflow-x: auto;
    }
    .tab-btn {
      background: #f4f7f6;
      color: var(--text);
      padding: 12px 20px;
      border-radius: 8px;
      margin: 0;
      width: auto;
      flex: none;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .students-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      border: 1px solid #dbe3ea;
      border-radius: 12px;
      margin-top: 15px;
      margin-bottom: 15px;
      max-height: 250px;
      overflow: auto;
      background: white;
    }

    .student-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
      text-align: left;
      color: var(--text);
    }
    .student-item:hover { background: #f4f7fb; }
    .student-checkbox { width: 18px; height: 18px; cursor: pointer; margin: 0; flex: 0 0 auto; }
    .access-note { font-size: 14px; color: var(--muted); margin-top: 8px; text-align: center; }

    @media (max-width: 720px) {
      .container { padding: 14px; }
      .card { padding: 18px; border-radius: 16px; }
      .grid { grid-template-columns: 1fr; }
      .screen-top { flex-direction: column; align-items: stretch; }
      .screen-top .right { width: 100%; flex: 1 1 auto; }
      #question { font-size: 21px; }
      .result-score { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="screen-login" class="card"></div>
    <div id="screen-selection" class="card hidden"></div>
    <div id="screen-quiz" class="card hidden"></div>
    <div id="screen-result" class="card hidden"></div>
    <div id="screen-admin" class="card hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://enthswnpuhvmxyjfltms.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVudGhzd25wdWh2bXh5amZsdG1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDA3MzcsImV4cCI6MjA5MzkxNjczN30.2KNWdop3LP5RwDqNuK_ZDnWQAoyKQ-gJQ0Z0FXc6XPY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const screenLogin = document.getElementById('screen-login');
    const screenSelection = document.getElementById('screen-selection');
    const screenQuiz = document.getElementById('screen-quiz');
    const screenResult = document.getElementById('screen-result');
    const screenAdmin = document.getElementById('screen-admin');

    // Сохраняем текущую открытую вкладку админа, чтобы после обновления таблицы оставаться на ней
    let currentAdminTab = 'subjects';

    const TEST_TITLES = {
      personal_finance: 'Персональные финансы',
      portfolio_theory: 'Теория портфеля',
      econometrics: 'Эконометрика',
      bank_accounting: 'Бухгалтерия в банке',
      bank_accounting_records: 'Бухгалтерский учет в банке',
      green_economy: 'Зеленая экономика',
      money_and_banks: 'Деньги и банки',
      finance: 'Финансы'
    };

    const tests = {
      personal_finance: [{ q: 'Что такое ликвидность?', a: ['Способность быстро превратить актив в деньги', 'Тип кредита', 'Форма налога', 'Вид страховки'], c: 0 }],
      portfolio_theory: [{ q: 'Что такое диверсификация?', a: ['Распределение активов', 'Тип кредита', 'Форма налога', 'Метод аудита'], c: 0 }],
      econometrics: [{ q: 'Что изучает эконометрика?', a: ['Экономические модели и данные', 'Только бухгалтерию', 'Налоги', 'Маркетинг'], c: 0 }],
      bank_accounting: [{ q: 'Что отражает актив банка?', a: ['Ресурсы банка', 'Только прибыль', 'Налоги', 'Устав'], c: 0 }],
      bank_accounting_records: [{ q: 'Что такое бухгалтерская проводка?', a: ['Запись операции', 'Вид кредита', 'Тип депозита', 'Форма маркетинга'], c: 0 }],
      green_economy: [{ q: 'Что такое зеленая экономика?', a: ['Экологически устойчивое развитие', 'Тип банка', 'Вид кредита', 'Метод учета'], c: 0 }],
      money_and_banks: [{ q: 'Главная функция Центрального банка?', a: ['Монетарная политика', 'Продажа товаров', 'Страхование', 'Маркетинг'], c: 0 }],
      finance: [{ q: 'Что такое инфляция?', a: ['Рост цен', 'Снижение зарплат', 'Рост налогов', 'Укрепление валюты'], c: 0 }]
    };

    const state = {
      currentUser: null,
      currentTestKey: null,
      questions: [],
      currentIndex: 0,
      score: 0
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function cloneQuestion(q) {
      return {
        q: q.q,
        a: Array.isArray(q.a) ? [...q.a] : [],
        c: q.c
      };
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showScreen(activeId) {
      const screens = [screenLogin, screenSelection, screenQuiz, screenResult, screenAdmin];
      screens.forEach(s => s.classList.add('hidden'));
      document.getElementById(activeId).classList.remove('hidden');
    }

    function setSavedUser(user) {
      localStorage.setItem('user', JSON.stringify(user));
    }

    function clearSavedUser() {
      localStorage.removeItem('user');
    }

    function getTestTitle(key) {
      return TEST_TITLES[key] || 'Тест';
    }

    function renderLogin() {
      showScreen('screen-login');

      screenLogin.innerHTML = `
        <h1>Вход в систему</h1>
        <div class="muted">Введите логин и пароль</div>
        <input id="username" placeholder="Логин" autocomplete="username" />
        <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" />
        <button id="login-btn" class="btn-ok">Войти</button>
        <div class="small-note">Если у вас уже есть аккаунт, вход сохранится после обновления страницы.</div>
      `;

      document.getElementById('login-btn').addEventListener('click', handleLogin);
      document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
    }

    async function renderSelection() {
      showScreen('screen-selection');
      const now = new Date().toISOString();

      const { data, error } = await supabaseClient
        .from('test_access')
        .select('*')
        .eq('username', state.currentUser.username)
        .eq('is_active', true)
        .lte('start_time', now)
        .gte('end_time', now);

      if (error) {
        console.log(error);
        screenSelection.innerHTML = `<h1>Ошибка доступа</h1>`;
        return;
      }

      let html = `
        <div class="screen-top">
          <div class="left">
            <h1 class="title-left">Доступные тесты</h1>
            <div class="subtitle-left">Пользователь: ${escapeHtml(state.currentUser.username)}</div>
          </div>
          <div class="right">
            <button class="btn-bad" onclick="logout()">🚪 Выйти</button>
          </div>
        </div>
      `;

      if (!data.length) {
        html += `<div class="muted">Сейчас вам недоступны тесты</div>`;
      } else {
        html += `<div class="grid">`;
        data.forEach(test => {
          html += `
            <button onclick="startTest('${test.test_key}')">
              ${getTestTitle(test.test_key)}
            </button>
          `;
        });
        html += `</div>`;
      }

      screenSelection.innerHTML = html;
    }

    function renderQuizShell() {
      showScreen('screen-quiz');

      screenQuiz.innerHTML = `
        <div class="screen-top">
          <div class="left">
            <h1 id="quiz-title" class="title-left">${escapeHtml(getTestTitle(state.currentTestKey))}</h1>
            <div class="subtitle-left">Пользователь: ${escapeHtml(state.currentUser.username)}</div>
          </div>
          <div class="right">
            <button class="btn-bad" onclick="logout()">🚪 Выйти</button>
          </div>
        </div>

        <div id="counter"></div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="question"></div>
        <div id="options"></div>
        <button id="next-btn" class="hidden btn-ok" onclick="nextQuestion()">Следующий вопрос</button>
      `;
    }

    function renderResult() {
      showScreen('screen-result');

      const total = state.questions.length;
      const wrong = total - state.score;
      const percent = total ? Math.round((state.score / total) * 100) : 0;

      let text = 'Результат сохранён.';
      if (percent >= 90) text = 'Отличный результат.';
      else if (percent >= 70) text = 'Хороший результат.';
      else if (percent >= 50) text = 'Неплохо, но есть что подтянуть.';
      else text = 'Вам следует повторить материал.';

      screenResult.innerHTML = `
        <div class="screen-top">
          <div class="left">
            <h1 class="title-left">Тест завершён</h1>
            <div class="subtitle-left">Пользователь: ${escapeHtml(state.currentUser.username)}</div>
          </div>
          <div class="right">
            <button class="btn-bad" onclick="logout()">🚪 Выйти</button>
          </div>
        </div>

        <div class="result-score">${state.score} / ${total}</div>
        <div class="result-meta">Правильных: ${state.score}, ошибок: ${wrong}, процент: ${percent}%</div>
        <div class="muted">${escapeHtml(text)}</div>

        <div class="toolbar">
          <button class="btn-gray" onclick="backToSelection()">К выбору тестов</button>
        </div>
      `;
    }

    // Вспомогательная функция для переключения вкладок
    function switchAdminTab(tabId) {
      currentAdminTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      const btn = document.getElementById('btn-' + tabId);
      const content = document.getElementById('tab-' + tabId);
      if(btn && content) {
        btn.classList.add('active');
        content.classList.add('active');
      }
    }

    function renderAdminPanel(users = [], results = [], accesses = []) {
      showScreen('screen-admin');

      // Генерация таблицы предметов
      const subjectRows = Object.keys(TEST_TITLES).map(key => `
        <tr>
          <td>${escapeHtml(TEST_TITLES[key])}</td>
          <td><code>${escapeHtml(key)}</code></td>
        </tr>
      `).join('');

      // Генерация таблицы пользователей
      const userRows = users.length
        ? users.map(user => `
            <tr>
              <td>${escapeHtml(user.id)}</td>
              <td>${escapeHtml(user.username)}</td>
              <td>${escapeHtml(user.role)}</td>
              <td>
                ${user.username === state.currentUser.username ? '' : `<button class="btn-bad" style="padding:10px; width:auto;" onclick="deleteUser(${user.id})">❌</button>`}
              </td>
            </tr>
          `).join('')
        : `<tr><td colspan="4">Пользователей пока нет</td></tr>`;

      // Генерация таблицы доступов (С ФИЛЬТРОМ)
      const accessRows = accesses.length
        ? accesses.map(row => `
            <tr class="access-row" data-test="${row.test_key}">
              <td>${escapeHtml(row.username)}</td>
              <td>${escapeHtml(getTestTitle(row.test_key))}</td>
              <td>${new Date(row.start_time).toLocaleString()}</td>
              <td>${new Date(row.end_time).toLocaleString()}</td>
              <td>
                <button class="btn-bad" style="padding:10px; width:auto;" onclick="deleteAccess(${row.id})">❌</button>
              </td>
            </tr>
          `).join('')
        : `<tr><td colspan="5">Нет активных доступов</td></tr>`;

      // Генерация таблицы результатов (С ФИЛЬТРОМ)
      const resultRows = results.length
        ? results.map(row => {
            const testKey = Object.keys(TEST_TITLES).find(k => TEST_TITLES[k] === row.test_name) || 'unknown';
            return `
            <tr class="result-row" data-test="${testKey}">
              <td>${escapeHtml(row.id)}</td>
              <td>${escapeHtml(row.username)}</td>
              <td>${escapeHtml(row.test_name)}</td>
              <td>${escapeHtml(row.score)}/${escapeHtml(row.total)}</td>
              <td>${escapeHtml(row.percentage)}%</td>
              <td><button class="btn-bad" style="padding:10px; width:auto;" onclick="deleteResult(${row.id})">❌</button></td>
            </tr>
          `}).join('')
        : `<tr><td colspan="6">Результатов пока нет</td></tr>`;

      screenAdmin.innerHTML = `
        <div class="screen-top">
          <div class="left">
            <h1 class="title-left">Админ-панель</h1>
            <div class="subtitle-left">Администратор: ${escapeHtml(state.currentUser.username)}</div>
          </div>
          <div class="right">
            <button class="btn-bad" onclick="logout()">🚪 Выйти</button>
          </div>
        </div>

        <div class="admin-tabs">
          <button id="btn-subjects" class="tab-btn" onclick="switchAdminTab('subjects')">Предметы</button>
          <button id="btn-students" class="tab-btn" onclick="switchAdminTab('students')">Студенты</button>
          <button id="btn-exams" class="tab-btn" onclick="switchAdminTab('exams')">Экзамены</button>
          <button id="btn-results" class="tab-btn" onclick="switchAdminTab('results')">Результаты</button>
        </div>

        <!-- Вкладка Предметы -->
        <div id="tab-subjects" class="tab-content admin-section">
          <h2>Список тестовых предметов</h2>
          <div class="table-wrap">
            <table>
              <tr><th>Название</th><th>Системный ключ</th></tr>
              ${subjectRows}
            </table>
          </div>
        </div>

        <!-- Вкладка Студенты -->
        <div id="tab-students" class="tab-content admin-section">
          <div class="card" style="box-shadow:none; margin-top:0; padding:0; margin-bottom: 20px;">
            <h2>Создать пользователя</h2>
            <input id="new-username" placeholder="Логин" autocomplete="off" />
            <input id="new-password" placeholder="Пароль" autocomplete="off" />
            <select id="new-role">
              <option value="student">student (Студент)</option>
              <option value="admin">admin (Админ)</option>
            </select>
            <button class="btn-ok" onclick="createUser()">Создать</button>
          </div>
          <h2>Список пользователей</h2>
          <div class="table-wrap">
            <table>
              <tr><th>ID</th><th>Логин</th><th>Роль</th><th>Удалить</th></tr>
              ${userRows}
            </table>
          </div>
        </div>

        <!-- Вкладка Экзамены -->
        <div id="tab-exams" class="tab-content admin-section">
          <div class="card" style="box-shadow:none; margin-top:0; padding:0; margin-bottom: 20px;">
            <h2>Открыть доступ</h2>
            <select id="access-test">
              ${Object.keys(TEST_TITLES).map(key => `<option value="${key}">${escapeHtml(TEST_TITLES[key])}</option>`).join('')}
            </select>

            <div id="students-list" class="students-list">Загрузка студентов...</div>

            <label style="display:block;margin-top:15px;">Начало доступа</label>
            <input id="access-start" type="datetime-local">

            <label style="display:block;margin-top:15px;">Конец доступа</label>
            <input id="access-end" type="datetime-local">

            <button class="btn-ok" onclick="grantAccess()">Открыть доступ</button>
            <div class="access-note">Выберите одного или нескольких студентов. Попытки не ограничены.</div>
          </div>
          
          <h2>Активные доступы</h2>
          
          <select id="filter-access" onchange="filterTableRows('access-row', this.value)" style="margin-bottom: 15px;">
            <option value="all">Все предметы</option>
            ${Object.keys(TEST_TITLES).map(key => `<option value="${key}">${escapeHtml(TEST_TITLES[key])}</option>`).join('')}
          </select>

          <div class="table-wrap">
            <table>
              <tr><th>Студент</th><th>Предмет</th><th>Начало</th><th>Конец</th><th>Удалить</th></tr>
              ${accessRows}
            </table>
          </div>
        </div>

        <!-- Вкладка Результаты -->
        <div id="tab-results" class="tab-content admin-section">
          <h2>Результаты тестов</h2>
          
          <select id="filter-result" onchange="filterTableRows('result-row', this.value)" style="margin-bottom: 15px;">
            <option value="all">Все предметы</option>
            ${Object.keys(TEST_TITLES).map(key => `<option value="${key}">${escapeHtml(TEST_TITLES[key])}</option>`).join('')}
          </select>

          <div class="table-wrap">
            <table>
              <tr><th>ID</th><th>Пользователь</th><th>Тест</th><th>Баллы</th><th>%</th><th>Удалить</th></tr>
              ${resultRows}
            </table>
          </div>
        </div>
      `;

      loadStudentsList();
      switchAdminTab(currentAdminTab); // Восстанавливаем открытую вкладку
    }

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('Введите логин и пароль');
        return;
      }

      const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .single();

      if (error || !data) {
        alert('Неверный логин или пароль');
        return;
      }

      state.currentUser = data;
      setSavedUser(data);

      if (data.role === 'admin') {
        await openAdminPanel();
      } else {
        await renderSelection();
      }
    }

    function startTest(testKey) {
      if (!tests[testKey]) {
        alert('Тест не найден');
        return;
      }

      state.currentTestKey = testKey;
      state.questions = shuffleArray(tests[testKey].map(cloneQuestion));
      state.currentIndex = 0;
      state.score = 0;

      renderQuizShell();
      loadQuestion();
    }

    function loadQuestion() {
      if (!state.questions.length) {
        finishQuiz();
        return;
      }

      const q = state.questions[state.currentIndex];
      const total = state.questions.length;

      document.getElementById('quiz-title').innerText = getTestTitle(state.currentTestKey);
      document.getElementById('counter').innerText = `Вопрос ${state.currentIndex + 1} из ${total}`;
      document.getElementById('progress-bar').style.width = `${(state.currentIndex / total) * 100}%`;
      document.getElementById('question').innerText = q.q;

      const options = document.getElementById('options');
      options.innerHTML = '';

      const shuffledOptions = shuffleArray(
        q.a.map((text, idx) => ({
          text,
          correct: idx === q.c
        }))
      );

      shuffledOptions.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.type = 'button';
        btn.textContent = item.text;
        btn.dataset.correct = item.correct ? '1' : '0';
        btn.addEventListener('click', () => selectAnswer(btn, item.correct));
        options.appendChild(btn);
      });

      document.getElementById('next-btn').classList.add('hidden');
    }

    function selectAnswer(selectedBtn, isCorrect) {
      const buttons = document.querySelectorAll('#options .option');
      buttons.forEach(btn => btn.disabled = true);

      buttons.forEach(btn => {
        if (btn.dataset.correct === '1') {
          btn.classList.add('correct');
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.add('wrong');
      } else {
        state.score++;
      }

      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      state.currentIndex++;
      if (state.currentIndex < state.questions.length) {
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    async function saveResult() {
      const total = state.questions.length || 1;
      const percentage = Number(((state.score / total) * 100).toFixed(2));

      const { error } = await supabaseClient
        .from('results')
        .insert([
          {
            username: state.currentUser.username,
            test_name: getTestTitle(state.currentTestKey),
            score: state.score,
            total: state.questions.length,
            percentage: percentage
          }
        ]);

      if (error) {
        console.error('Ошибка сохранения результата:', error);
      }
    }

    async function finishQuiz() {
      await saveResult();
      renderResult();
    }

    function backToSelection() {
      state.currentTestKey = null;
      state.questions = [];
      state.currentIndex = 0;
      state.score = 0;
      renderSelection();
    }

    function logout() {
      clearSavedUser();
      state.currentUser = null;
      state.currentTestKey = null;
      state.questions = [];
      state.currentIndex = 0;
      state.score = 0;
      renderLogin();
    }

    async function loadStudentsList() {
      const container = document.getElementById('students-list');
      if (!container) return;

      const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .neq('role', 'admin')
        .order('id', { ascending: true });

      if (error) {
        console.log(error);
        container.innerHTML = 'Ошибка загрузки';
        return;
      }

      const students = data || [];

      if (!students.length) {
        container.innerHTML = '<div class="muted" style="margin:0;">Нет студентов</div>';
        return;
      }

      let html = '';
      students.forEach(user => {
        html += `
          <label class="student-item">
            <input type="checkbox" value="${escapeHtml(user.username)}" class="student-checkbox">
            <span>${escapeHtml(user.username)}</span>
          </label>
        `;
      });

      container.innerHTML = html;
    }

    async function grantAccess() {
      const testKey = document.getElementById('access-test').value;
      const usernames = [...document.querySelectorAll('.student-checkbox:checked')].map(cb => cb.value);
      const startRaw = document.getElementById('access-start').value;
      const endRaw = document.getElementById('access-end').value;

      if (!usernames.length || !startRaw || !endRaw) {
        alert('Заполните поля (выберите хотя бы одного студента и укажите даты)');
        return;
      }

      const start = new Date(startRaw).toISOString();
      const end = new Date(endRaw).toISOString();

      for (const username of usernames) {
        const { error: deleteError } = await supabaseClient
          .from('test_access')
          .delete()
          .eq('username', username)
          .eq('test_key', testKey);

        if (deleteError) {
          console.log(deleteError);
          alert('Ошибка обновления доступа');
          return;
        }

        const { error: insertError } = await supabaseClient
          .from('test_access')
          .insert([
            {
              username,
              test_key: testKey,
              start_time: start,
              end_time: end,
              is_active: true
            }
          ]);

        if (insertError) {
          console.log(insertError);
          alert('Ошибка выдачи доступа');
          return;
        }
      }

      alert('Доступ успешно открыт');
      await openAdminPanel();
    }

    async function createUser() {
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value.trim();
      const role = document.getElementById('new-role').value;

      if (!username || !password) {
        alert('Заполните логин и пароль');
        return;
      }

      const { error } = await supabaseClient
        .from('users')
        .insert([{ username, password, role }]);

      if (error) {
        alert('Ошибка создания пользователя');
        console.error(error);
        return;
      }

      alert('Пользователь создан');
      await openAdminPanel();
    }

    async function deleteUser(id) {
      if (!confirm('Удалить пользователя?')) return;

      const { error } = await supabaseClient.from('users').delete().eq('id', id);
      if (error) {
        alert('Ошибка удаления пользователя');
        console.error(error);
        return;
      }
      await openAdminPanel();
    }

    async function deleteAccess(id) {
      if (!confirm('Удалить доступ?')) return;

      const { error } = await supabaseClient.from('test_access').delete().eq('id', id);
      if (error) {
        alert('Ошибка удаления доступа');
        console.error(error);
        return;
      }
      await openAdminPanel();
    }

    async function deleteResult(id) {
      if (!confirm('Удалить результат?')) return;

      const { error } = await supabaseClient.from('results').delete().eq('id', id);
      if (error) {
        alert('Ошибка удаления результата');
        console.error(error);
        return;
      }
      await openAdminPanel();
    }

    async function openAdminPanel() {
      showScreen('screen-admin');

      const [usersResponse, resultsResponse, accessResponse] = await Promise.all([
        supabaseClient.from('users').select('*').order('id', { ascending: true }),
        supabaseClient.from('results').select('*').order('id', { ascending: false }),
        supabaseClient.from('test_access').select('*').order('id', { ascending: false })
      ]);

      const users = usersResponse.data || [];
      const results = resultsResponse.data || [];
      const accesses = accessResponse.data || [];

      renderAdminPanel(users, results, accesses);
    }

    // Функция для фильтрации таблиц
    function filterTableRows(rowClassName, selectedKey) {
      const rows = document.querySelectorAll('.' + rowClassName);
      
      rows.forEach(row => {
        if (selectedKey === 'all' || row.dataset.test === selectedKey) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    function init() {
      const savedUser = localStorage.getItem('user');

      if (savedUser) {
        try {
          const parsed = JSON.parse(savedUser);
          state.currentUser = parsed;

          if (parsed.role === 'admin') {
            openAdminPanel();
          } else {
            renderSelection();
          }
          return;
        } catch (e) {
          localStorage.removeItem('user');
        }
      }

      renderLogin();
    }

    init();
  </script>
</body>
</html>
