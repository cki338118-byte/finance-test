<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тест: Финансы</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f7f6;
      color:#24303f;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:30px;
      margin-top:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    h1{
      text-align:center;
      color:#1368CE;
    }

    #question{
      font-size:24px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .option{
      display:block;
      width:100%;
      margin:10px 0;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#eef2f7;
      cursor:pointer;
      font-size:18px;
      transition:0.2s;
    }

    .option:hover{
      background:#dfe8f5;
    }

    .correct{
      background:#28a745 !important;
      color:white;
    }

    .wrong{
      background:#dc3545 !important;
      color:white;
    }

    .hidden{
      display:none;
    }

    .btn{
      padding:14px 20px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
      margin-top:20px;
    }

    .btn-primary{
      background:#1368CE;
      color:white;
    }

    .btn-success{
      background:#28a745;
      color:white;
    }

    .progress{
      width:100%;
      height:12px;
      background:#ddd;
      border-radius:20px;
      overflow:hidden;
      margin-top:20px;
    }

    .progress-bar{
      height:100%;
      background:#1368CE;
      width:0%;
    }

    #score{
      font-size:32px;
      font-weight:bold;
      text-align:center;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Персональные финансы</h1>

  <div id="quiz-card" class="card">
    <div id="counter"></div>

    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="question"></div>

    <div id="options"></div>

    <button id="next-btn" class="btn btn-primary hidden">
      Следующий вопрос
    </button>
  </div>

  <div id="result-card" class="card hidden">
    <h2 style="text-align:center;">Тест завершен</h2>

    <div id="score"></div>

    <div style="text-align:center;">
      <button class="btn btn-primary" id="restart-btn">
        Начать сначала
      </button>

      <button class="btn btn-success" id="wrong-btn">
        Повторить ошибки
      </button>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL =
'https://enthswnpuhvmxyjfltms.supabase.co';

const SUPABASE_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVudGhzd25wdWh2bXh5amZsdG1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDA3MzcsImV4cCI6MjA5MzkxNjczN30.2KNWdop3LP5RwDqNuK_ZDnWQAoyKQ-gJQ0Z0FXc6XPY';

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const username =
prompt("Введите имя или логин");

const rawQuestions = [
{
q:"Что такое ликвидность?",
a:[
"Способность быстро превратить актив в деньги",
"Тип кредита",
"Форма налога",
"Вид страховки"
],
c:0
},
{
q:"Что такое инфляция?",
a:[
"Рост цен",
"Снижение зарплат",
"Рост налогов",
"Укрепление валюты"
],
c:0
}
];

function shuffleArray(array){
  const arr=[...array];

  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }

  return arr;
}

let questions=shuffleArray(rawQuestions);
let currentIndex=0;
let score=0;
let wrongQuestions=[];

function loadQuestion(){

  const q=questions[currentIndex];

  document.getElementById('counter').innerText =
  `Вопрос ${currentIndex+1} из ${questions.length}`;

  document.getElementById('question').innerText=q.q;

  document.getElementById('progress-bar').style.width=
  `${(currentIndex/questions.length)*100}%`;

  const options=document.getElementById('options');

  options.innerHTML='';

  q.a.forEach((option,index)=>{

    const btn=document.createElement('button');

    btn.className='option';

    btn.innerText=option;

    btn.onclick=()=>selectAnswer(btn,index===q.c);

    options.appendChild(btn);

  });

}

function selectAnswer(btn,isCorrect){

  const buttons=
  document.querySelectorAll('.option');

  buttons.forEach(b=>b.disabled=true);

  if(isCorrect){

    btn.classList.add('correct');

    score++;

  }else{

    btn.classList.add('wrong');

    wrongQuestions.push(
      questions[currentIndex]
    );

    buttons.forEach((b,i)=>{
      if(i===questions[currentIndex].c){
        b.classList.add('correct');
      }
    });

  }

  document
  .getElementById('next-btn')
  .classList.remove('hidden');

}

document
.getElementById('next-btn')
.onclick=()=>{

  currentIndex++;

  if(currentIndex<questions.length){

    loadQuestion();

    document
    .getElementById('next-btn')
    .classList.add('hidden');

  }else{

    finishQuiz();

  }

};

async function saveResult(){

  const total=questions.length;

  const percentage=
  ((score/total)*100).toFixed(2);

  await supabaseClient
  .from('results')
  .insert([
    {
      username:username||'Unknown',
      test_name:'Финансы',
      score:score,
      total:total,
      percentage:percentage
    }
  ]);

}

async function finishQuiz(){

  await saveResult();

  document
  .getElementById('quiz-card')
  .classList.add('hidden');

  document
  .getElementById('result-card')
  .classList.remove('hidden');

  document
  .getElementById('score')
  .innerText=
  `${score} / ${questions.length}`;

}

document
.getElementById('restart-btn')
.onclick=()=>{

  location.reload();

};

document
.getElementById('wrong-btn')
.onclick=()=>{

  if(!wrongQuestions.length){
    alert('Ошибок нет');
    return;
  }

  questions=shuffleArray(wrongQuestions);

  currentIndex=0;
  score=0;
  wrongQuestions=[];

  document
  .getElementById('result-card')
  .classList.add('hidden');

  document
  .getElementById('quiz-card')
  .classList.remove('hidden');

  loadQuestion();

};

loadQuestion();
</script>

</body>
</html>
